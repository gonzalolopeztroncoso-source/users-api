server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  datasource:
    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none   # usamos schema.sql para crear tablas
    properties:
      hibernate:
        show_sql: false
        format_sql: true
  sql:
    init:
      mode: always

# Regex configurables
app:
  regex:
    email: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
    password: "^(?=.*[A-Z])(?=.*\\d).{8,}$"

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui

security:
  jwt:
    secret: ${JWT_SECRET:test-secret-32-chars-min-1234567890}
    expiration-minutes: 120

logging:
  level:
    org.springdoc: DEBUG
    org.springdoc.api.AbstractOpenApiResource: TRACE
